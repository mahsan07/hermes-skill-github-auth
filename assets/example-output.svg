<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">GitHub Authentication example output</title><desc id="desc">An illustrative terminal showing the kind of reviewable output produced by GitHub Authentication.</desc>
<rect width="1200" height="660" rx="26" fill="#F8FAFC"/><rect width="1200" height="14" rx="7" fill="#0369A1"/>
<style>text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }</style>
<text x="54" y="62" font-size="14" font-weight="750" fill="#0369A1" text-anchor="start"><tspan x="54" dy="0">EXAMPLE TERMINAL OUTPUT</tspan></text><text x="54" y="110" font-size="31" font-weight="760" fill="#0F172A" text-anchor="start"><tspan x="54" dy="0">GitHub Authentication</tspan></text><rect x="70" y="175" width="1060" height="455" rx="22" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="95" y="205" width="1010" height="390" rx="16" fill="#111827"/><circle cx="128" cy="235" r="7" fill="#F87171"/><circle cx="152" cy="235" r="7" fill="#FBBF24"/><circle cx="176" cy="235" r="7" fill="#34D399"/><text x="125" y="300" font-size="20" font-weight="600" fill="#BFDBFE" text-anchor="start"><tspan x="125" dy="0">$ Account: mahsan07</tspan></text><text x="125" y="365" font-size="20" font-weight="600" fill="#D1FAE5" text-anchor="start"><tspan x="125" dy="0">+ Protocol: HTTPS</tspan></text><text x="125" y="430" font-size="20" font-weight="600" fill="#BFDBFE" text-anchor="start"><tspan x="125" dy="0">$ Scopes checked</tspan></text><text x="125" y="495" font-size="20" font-weight="600" fill="#D1FAE5" text-anchor="start"><tspan x="125" dy="0">+ Auth OK</tspan></text></svg>