<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">GitHub Authentication system map</title><desc id="desc">A skill-specific split diagram showing the operating components for GitHub Authentication.</desc>
<rect width="1200" height="660" rx="26" fill="#F8FAFC"/><rect width="1200" height="14" rx="7" fill="#0369A1"/>
<style>text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }</style>
<text x="54" y="62" font-size="14" font-weight="750" fill="#0369A1" text-anchor="start"><tspan x="54" dy="0">SPLIT SYSTEM MAP</tspan></text><text x="54" y="110" font-size="31" font-weight="760" fill="#0F172A" text-anchor="start"><tspan x="54" dy="0">GitHub Authentication</tspan></text><rect x="44" y="155" width="1112" height="475" rx="22" fill="#F0F9FF" stroke="#E0F2FE"/><text x="80" y="205" font-size="13" font-weight="750" fill="#0369A1" text-anchor="start"><tspan x="80" dy="0">OBSERVE / PREPARE</tspan></text><text x="655" y="205" font-size="13" font-weight="750" fill="#0369A1" text-anchor="start"><tspan x="655" dy="0">ACT / VERIFY</tspan></text><rect x="80" y="235" width="430" height="105" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><circle cx="110" cy="265" r="18" fill="#E0F2FE"/><text x="110" y="271" text-anchor="middle" font-size="17" font-weight="750" fill="#0369A1">1</text><text x="138" y="270" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="138" dy="0">GitHub account</tspan></text><rect x="80" y="380" width="430" height="105" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><circle cx="110" cy="410" r="18" fill="#E0F2FE"/><text x="110" y="416" text-anchor="middle" font-size="17" font-weight="750" fill="#0369A1">2</text><text x="138" y="415" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="138" dy="0">HTTPS token or SSH choice</tspan></text><rect x="655" y="205" width="430" height="92" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><circle cx="685" cy="235" r="18" fill="#E0F2FE"/><text x="685" y="241" text-anchor="middle" font-size="17" font-weight="750" fill="#0369A1">3</text><text x="713" y="240" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="713" dy="0">Credential helper or keychain</tspan></text><rect x="655" y="335" width="430" height="92" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><circle cx="685" cy="365" r="18" fill="#E0F2FE"/><text x="685" y="371" text-anchor="middle" font-size="17" font-weight="750" fill="#0369A1">4</text><text x="713" y="370" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="713" dy="0">gh authentication</tspan></text><rect x="655" y="465" width="430" height="92" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><circle cx="685" cy="495" r="18" fill="#E0F2FE"/><text x="685" y="501" text-anchor="middle" font-size="17" font-weight="750" fill="#0369A1">5</text><text x="713" y="500" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="713" dy="0">Read-only smoke check</tspan></text><path d="M510 360 L655 335" stroke="#0369A1" stroke-width="3" fill="none" marker-end="url(#arr)"/><line x1="582" y1="175" x2="582" y2="605" stroke="#0369A1" stroke-width="2" stroke-dasharray="8 7"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#0369A1"/></marker></defs></svg>