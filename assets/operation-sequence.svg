<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="778" viewBox="0 0 1080 778" role="img" aria-labelledby="title desc">
<title id="title">GitHub Authentication operation sequence</title><desc id="desc">An actor and data sequence containing the six concrete stages for GitHub Authentication.</desc>
<rect width="1080" height="778" rx="26" fill="#F8FAFC"/><rect width="1080" height="14" rx="7" fill="#0369A1"/>
<style>text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }</style>
<text x="54" y="62" font-size="14" font-weight="750" fill="#0369A1" text-anchor="start"><tspan x="54" dy="0">ACTOR AND DATA SEQUENCE</tspan></text><text x="54" y="110" font-size="31" font-weight="760" fill="#0F172A" text-anchor="start"><tspan x="54" dy="0">GitHub Authentication</tspan></text><rect x="130" y="155" width="190" height="72" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><text x="152" y="190" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="152" dy="0">GitHub account</tspan></text><line x1="225" y1="227" x2="225" y2="723" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 7"/><rect x="370" y="155" width="190" height="72" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><text x="392" y="190" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="392" dy="0">GitHub</tspan><tspan x="392" dy="23">Authentication</tspan></text><line x1="465" y1="227" x2="465" y2="723" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 7"/><rect x="610" y="155" width="190" height="72" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><text x="632" y="190" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="632" dy="0">gh</tspan><tspan x="632" dy="23">authentication</tspan></text><line x1="705" y1="227" x2="705" y2="723" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 7"/><rect x="850" y="155" width="190" height="72" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><text x="872" y="190" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="872" dy="0">Read-only smoke</tspan><tspan x="872" dy="23">check</tspan></text><line x1="945" y1="227" x2="945" y2="723" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 7"/><path d="M225 270 L465 270" stroke="#0369A1" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="345.0" y="258" font-size="15" font-weight="650" fill="#334155" text-anchor="middle"><tspan x="345.0" dy="0">Choose HTTPS token SSH or browser login</tspan></text><circle cx="465" cy="270" r="5" fill="#0369A1"/><path d="M465 358 L705 358" stroke="#0369A1" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="585.0" y="346" font-size="15" font-weight="650" fill="#334155" text-anchor="middle"><tspan x="585.0" dy="0">Create or select credentials privately</tspan></text><circle cx="705" cy="358" r="5" fill="#0369A1"/><path d="M705 446 L945 446" stroke="#0369A1" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-dasharray="7 6"/><text x="825.0" y="434" font-size="15" font-weight="650" fill="#334155" text-anchor="middle"><tspan x="825.0" dy="0">Store through an approved credential</tspan><tspan x="825.0" dy="20">helper</tspan></text><circle cx="945" cy="446" r="5" fill="#0369A1"/><path d="M225 534 L465 534" stroke="#0369A1" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="345.0" y="522" font-size="15" font-weight="650" fill="#334155" text-anchor="middle"><tspan x="345.0" dy="0">Authenticate gh or Git transport</tspan></text><circle cx="465" cy="534" r="5" fill="#0369A1"/><path d="M465 622 L705 622" stroke="#0369A1" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="585.0" y="610" font-size="15" font-weight="650" fill="#334155" text-anchor="middle"><tspan x="585.0" dy="0">Test identity and repository access</tspan></text><circle cx="705" cy="622" r="5" fill="#0369A1"/><path d="M705 710 L945 710" stroke="#0369A1" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-dasharray="7 6"/><text x="825.0" y="698" font-size="15" font-weight="650" fill="#334155" text-anchor="middle"><tspan x="825.0" dy="0">Report status without printing secrets</tspan></text><circle cx="945" cy="710" r="5" fill="#0369A1"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#0369A1"/></marker></defs></svg>